# Mynd RPi Link Daemon Configuration File

[configure_moode]
# Enable configure-moode boot service (UART, I2C, I2S, SSH, audio DB config).
# When false, the service exits immediately without doing anything.
enabled = true
# Path to Raspberry Pi boot config file
boot_config_path = /boot/firmware/config.txt
# Boot volume for Moode software mixer (volknob) set by configure-moode at boot.
# Valid range: 0..100 (out-of-range values are clamped).
moode_boot_volume_percent = 10
# Bluetooth absolute-volume step used by the daemon when handling set_volume in software mode.
# Valid range: 1..10 (internally clamped).
bt_sw_volume_step = 2

[uart]
# UART device path (typically /dev/serial0 or /dev/ttyS0 on Raspberry Pi)
device = /dev/serial0
# Baud rate (must match MCU configuration)
baudrate = 115200
# Read timeout in seconds
timeout = 0.2

[moode]
# Moode API base URL
base_url = http://localhost
# API request timeout in seconds
api_timeout = 5.0
# Number of retry attempts for failed API calls
retry_count = 3
# Interval in seconds for polling MPD streaming state (lower = faster LED source detection)
streaming_poll_interval = 2.0
# MPD TCP port (used as fallback if Unix socket unavailable)
mpd_port = 6600

[power]
# Delay in seconds before executing poweroff command (NOT USED - always 0.0)
# The daemon always syncs filesystems before poweroff for safety
poweroff_delay = 0.0
# Command to execute for power off (must be in sudoers)
poweroff_command = sudo poweroff

[hotspot]
# WiFi hotspot settings (triggered by BT button triple press)
# If both ssid and password are set, the daemon creates/starts that hotspot.
# Otherwise it uses an existing hotspot connection by name.
# If connection_name is empty, the daemon derives Moode's hotspot name from
# hostname (example: moode-rpi-zero -> Moode-rpi-zero).
# NOTE: To use Moode hotspot mode, first set a hotspot password in Moode web UI
# so the hotspot connection exists in NetworkManager.
connection_name =
# Optional custom hotspot SSID/password. Leave both empty to use Moode hotspot.
ssid =
password =
# WiFi interface used for hotspot activation and IP reporting
interface = wlan0

[bt_wifi_coexistence]
# Aggressive BT stability mode for Pi Zero 2 W:
# In an attempt to imporve bluetooth stability,
# turn WiFi radio off while Bluetooth is active and restore it after disconnecting.
# Requires sudoers entries for:
#   /usr/bin/nmcli radio wifi off
#   /usr/bin/nmcli radio wifi on
disable_wifi_when_bt_active = true
# true  -> disable WiFi only while BT source is actively streaming
# false -> disable WiFi whenever BT source is selected
disable_only_while_streaming = true
# After BT session ends, attempt to reconnect previously active WiFi profile(s)
restore_previous_connection = true

[logging]
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = INFO
# Use syslog (true) or stdout (false)
use_syslog = true

